[package]
name = "discord-gtk"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
async-trait = "0.1.92"
cpal = { version = "0.18.2", features = ["pipewire"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_16"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
ringbuf = "0.5.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
songbird = { version = "0.6.1", default-features = false, features = ["driver", "receive", "rustls", "tungstenite", "gateway"] }
symphonia = { version = "0.5.5", default-features = false, features = ["pcm"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webkit6 = "0.6.1"
zstd = "0.14.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

